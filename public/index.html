<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZyskAI v0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#181818;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:auto;padding:22px 16px 60px}.brand{font-weight:800;font-size:25px}.sub{color:#707070;margin:4px 0 24px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:12px 0}
label{display:block;font-weight:650;margin:12px 0 7px}input{width:100%;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#181818;color:#fff;font-size:16px;font-weight:750;margin-top:15px}
button:disabled{opacity:.5}.preview{width:100%;max-height:260px;object-fit:contain;border-radius:12px;display:none;margin-top:12px;background:#eee}
.status{font-size:28px;font-weight:850}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px;background:#f6f6f4;border-radius:12px}.metric b{display:block;font-size:19px;margin-top:3px}
.good{color:#176a3a}.bad{color:#9b2727}.warn{color:#80610d}.hidden{display:none}
a{color:#181818}.tiny{font-size:12px;color:#777}.loader{text-align:center;padding:12px}
</style></head>
<body><main>
<div class="brand">ZyskAI <span class="tiny">v0.2</span></div>
<div class="sub">Zdjęcie → rynek → marża → decyzja</div>
<div class="card">
<label>1. Zdjęcie przedmiotu</label>
<input id="image" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview">
<label>2. Cena zakupu (zł)</label>
<input id="price" type="number" min="1" step="1" placeholder="np. 200">
<button id="go">Analizuj przedmiot</button>
<div class="tiny" style="margin-top:10px">Wycena jest szacunkiem. Przed zakupem sprawdź stan, kompletność, autentyczność i ceny źródłowe.</div>
</div>
<div id="loading" class="card hidden loader">Analizuję zdjęcie i rynek…</div>
<div id="result" class="hidden"></div>
</main>
<script>
const $=id=>document.getElementById(id), img=$("image"), preview=$("preview"), go=$("go");
img.onchange=()=>{if(img.files[0]){preview.src=URL.createObjectURL(img.files[0]);preview.style.display="block"}};
const money=n=>Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString("pl-PL")+" zł":"—";
go.onclick=async()=>{
 if(!img.files[0]||!Number($("price").value)){alert("Dodaj zdjęcie i cenę.");return}
 go.disabled=true;$("loading").classList.remove("hidden");$("result").classList.add("hidden");
 const fd=new FormData();fd.append("image",img.files[0]);fd.append("buyPrice",$("price").value);
 try{
  const r=await fetch("/api/analyze",{method:"POST",body:fd}); const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Błąd");
  let cls=d.decision==="KUP"?"good":d.decision==="ODRZUĆ"?"bad":"warn";
  if(d.needs_more_info){
    $("result").innerHTML=`<div class="card"><div class="status warn">POTRZEBUJĘ WIĘCEJ DANYCH</div><h2>${d.product||"Niepewna identyfikacja"}</h2><p>${d.question||d.reason}</p><p class="muted">Pewność: ${d.confidence||0}%</p></div>`;
  } else {
    const comps=(d.comparables||[]).slice(0,5).map(x=>`<li>${x.url?`<a href="${x.url}" target="_blank" rel="noopener">`:''}${x.title||"Oferta"}${x.url?'</a>':''} — <b>${money(x.price)}</b></li>`).join("");
    $("result").innerHTML=`<div class="card"><div class="status ${cls}">${d.decision}</div><h2>${d.product||""}</h2><div class="muted">${d.variant||""} · pewność ${d.confidence||0}%</div><p>${d.reason||""}</p>
    <div class="grid">
    <div class="metric">Zakup<b>${money(d.buyPrice)}</b></div><div class="metric">Szybka sprzedaż<b>${money(d.quick_sale)}</b></div>
    <div class="metric">Rynek<b>${money(d.market_low)}–${money(d.market_high)}</b></div><div class="metric">Kup maks.<b>${money(d.max_buy)}</b></div>
    <div class="metric">Zysk<b>${money(d.profit)}</b></div><div class="metric">ROI<b>${Math.round(d.roi||0)}%</b></div>
    </div><p><b>Ryzyko:</b> ${d.risk||"—"}</p>${comps?`<h3>Porównywalne oferty</h3><ul>${comps}</ul>`:""}</div>`;
  }
  $("result").classList.remove("hidden");
 }catch(e){$("result").innerHTML=`<div class="card"><b>Błąd:</b> ${e.message}</div>`;$("result").classList.remove("hidden")}
 finally{go.disabled=false;$("loading").classList.add("hidden")}
};
</script></body></html>
